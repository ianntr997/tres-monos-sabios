name: Compilar mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dar permiso a gradlew
        run: chmod +x gradlew

      - name: Compilar
        run: ./gradlew build

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: tres-monos-sabios
          path: build/libs/*.jar
